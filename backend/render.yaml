services:
  - type: web
    name: customer-churn-backend
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 2 --timeout 120 --graceful-timeout 30 --keep-alive 5 app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://churn-chi.vercel.app
      - key: ENABLE_TRAINING
        value: "false"
